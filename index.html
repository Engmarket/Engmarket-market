<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eng Market | المنصة الهندسية</title>
    
    <style>
        :root { --primary: #0d1b2a; --brand: #c5a059; --light-bg: #f4f7f9; --white: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: var(--light-bg); color: var(--primary); transition: all 0.3s; }

        header { background: var(--primary); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 1.4rem; font-weight: 900; color: var(--brand); text-decoration: none; }
        .lang-toggle { background: transparent; border: 1.5px solid var(--brand); color: var(--brand); padding: 6px 15px; border-radius: 5px; font-size: 0.8rem; cursor: pointer; font-weight: bold; }

        .hero-slider { width: 100%; height: 250px; position: relative; overflow: hidden; background: #000; }
        .slide { position: absolute; width: 100%; height: 100%; opacity: 0; transition: 1s; background-size: cover; background-position: center; display: flex; align-items: flex-end; }
        .slide.active { opacity: 0.6; }
        .slide-text { padding: 20px; color: white; width: 100%; background: linear-gradient(transparent, rgba(0,0,0,0.8)); }

        .search-section { background: white; padding: 20px 5%; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        #mainSearch { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 1rem; margin-bottom: 15px; box-sizing: border-box; }
        .tabs-container { display: flex; overflow-x: auto; gap: 10px; scrollbar-width: none; }
        .loc-tab { padding: 8px 18px; background: #e9ecef; border-radius: 20px; white-space: nowrap; cursor: pointer; border: none; font-weight: bold; font-size: 0.8rem; }
        .loc-tab.active { background: var(--brand); color: white; }

        .services-ribbon { display: flex; overflow-x: auto; gap: 20px; padding: 20px 5%; background: white; border-bottom: 1px solid #eee; }
        .service-card { flex: 0 0 auto; text-align: center; width: 80px; cursor: pointer; }
        .icon-circle { width: 60px; height: 60px; background: white; border: 2px solid var(--brand); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .service-card span { font-size: 0.75rem; font-weight: bold; }

        .container { padding: 20px 5%; max-width: 1200px; margin: auto; }
        .comp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 12px; padding: 15px; border: 1px solid #eee; }
        .btn-act { padding: 10px; text-align: center; border-radius: 5px; text-decoration: none; font-weight: bold; font-size: 0.8rem; display: inline-block; width: 45%; }
        .btn-tel { background: var(--primary); color: white; }
        .btn-wa { background: #25d366; color: white; float: left; }

        footer { background: var(--primary); color: white; text-align: center; padding: 30px; margin-top: 40px; border-top: 4px solid var(--brand); }
    </style>
</head>
<body>

<header>
    <a href="#" class="logo" id="siteLogo">ENG MARKET</a>
    <button class="lang-toggle" onclick="changeLang()" id="langBtn">English</button>
</header>

<div class="hero-slider" id="slider">
    <div class="slide active" style="background-image: url('https://images.unsplash.com/photo-1541888946425-d81bb19480c5?q=80&w=800')">
        <div class="slide-text"><h2 id="s1">أفضل شركات الحديد</h2></div>
    </div>
    <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1503387762-592dee58c460?q=80&w=800')">
        <div class="slide-text"><h2 id="s2">خدمات الباطون</h2></div>
    </div>
</div>

<div class="search-section">
    <input type="text" id="mainSearch" onkeyup="smartSearch()" placeholder="ابحث عن شركة...">
    <div class="tabs-container" id="locTabs">
        <button class="loc-tab active" data-key="all" onclick="filterLoc('الكل', this)">كل لبنان</button>
        <button class="loc-tab" data-key="beirut" onclick="filterLoc('بيروت', this)">بيروت</button>
        <button class="loc-tab" data-key="north" onclick="filterLoc('الشمال', this)">الشمال</button>
        <button class="loc-tab" data-key="south" onclick="filterLoc('الجنوب', this)">الجنوب</button>
    </div>
</div>

<div class="services-ribbon" id="catBar"></div>

<div class="container">
    <div class="comp-grid" id="compGrid"></div>
</div>

<footer id="footerText">ENG MARKET | أكبر تجمع للموردين في لبنان</footer>

<script>
    // 1. البيانات والترجمة
    let currentLang = 'ar';
    const translations = {
        ar: {
            logo: "ENG MARKET", langBtn: "English", search: "ابحث عن شركة...", 
            all: "كل لبنان", beirut: "بيروت", north: "الشمال", south: "الجنوب",
            footer: "ENG MARKET | أكبر تجمع للموردين في لبنان", call: "اتصال", wa: "واتساب",
            s1: "أفضل شركات الحديد", s2: "خدمات الباطون"
        },
        en: {
            logo: "ENG MARKET", langBtn: "العربية", search: "Search companies...", 
            all: "All Lebanon", beirut: "Beirut", north: "North", south: "South",
            footer: "ENG MARKET | Largest Suppliers Hub in Lebanon", call: "Call", wa: "WhatsApp",
            s1: "Top Steel Companies", s2: "Concrete Services"
        }
    };

    const cats = [
        {n:"حديد", en:"Steel", i:"🏗️"}, {n:"باطون", en:"Concrete", i:"🚚"}, 
        {n:"خشب", en:"Wood", i:"🪵"}, {n:"رخام", en:"Marble", i:"🏛️"},
        {n:"طاقة", en:"Solar", i:"☀️"}, {n:"كهرباء", en:"Electric", i:"💡"}
    ];

    const companies = [
        { n: "ميتالكو", c: "حديد", l: "بيروت", p: "96103761784", d: "توريد حديد البناء" },
        { n: "صقر الشمال", c: "خشب", l: "الشمال", p: "96103000000", d: "تجارة الأخشاب" }
    ];

    // 2. دالة تغيير اللغة (المصححة)
    function changeLang() {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        const t = translations[currentLang];
        
        // تحديث اتجاه الصفحة
        document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        document.documentElement.lang = currentLang;

        // تحديث النصوص
        document.getElementById('siteLogo').innerText = t.logo;
        document.getElementById('langBtn').innerText = t.langBtn;
        document.getElementById('mainSearch').placeholder = t.search;
        document.getElementById('footerText').innerText = t.footer;
        document.getElementById('s1').innerText = t.s1;
        document.getElementById('s2').innerText = t.s2;

        // تحديث أزرار المناطق
        const tabs = document.querySelectorAll('.loc-tab');
        tabs.forEach(tab => {
            const key = tab.getAttribute('data-key');
            if(t[key]) tab.innerText = t[key];
        });

        // إعادة بناء الأيقونات والشركات باللغة الجديدة
        init();
    }

    function init() {
        const bar = document.getElementById('catBar');
        bar.innerHTML = '';
        cats.forEach(c => {
            bar.innerHTML += `
                <div class="service-card" onclick="filterCat('${c.n}')">
                    <div class="icon-circle">${c.i}</div>
                    <span>${currentLang === 'ar' ? c.n : c.en}</span>
                </div>`;
        });
        render(companies);
    }

    function render(data) {
        const grid = document.getElementById('compGrid');
        grid.innerHTML = '';
        const t = translations[currentLang];
        data.forEach(c => {
            grid.innerHTML += `
                <div class="card">
                    <div style="color:var(--brand); font-weight:bold; font-size:0.7rem;">📍 ${c.l}</div>
                    <h3 style="margin:5px 0;">${c.n}</h3>
                    <p style="font-size:0.8rem; color:#666;">${c.d}</p>
                    <div style="margin-top:15px;">
                        <a href="tel:${c.p}" class="btn-act btn-tel">${t.call}</a>
                        <a href="https://wa.me/${c.p}" class="btn-act btn-wa">${t.wa}</a>
                    </div>
                </div>`;
        });
    }

    // الفلترة والبحث
    function filterLoc(l, btn) {
        document.querySelectorAll('.loc-tab').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        render(l === 'الكل' ? companies : companies.filter(c => c.l === l));
    }

    function filterCat(cat) {
        render(companies.filter(c => c.c === cat));
    }

    function smartSearch() {
        const v = document.getElementById('mainSearch').value.toLowerCase();
        render(companies.filter(c => c.n.toLowerCase().includes(v)));
    }

    // السلايدر
    setInterval(() => {
        const slides = document.querySelectorAll('.slide');
        let active = document.querySelector('.slide.active');
        active.classList.remove('active');
        let next = active.nextElementSibling || slides[0];
        next.classList.add('active');
    }, 4000);

    window.onload = init;
</script>

</body>
</html>
