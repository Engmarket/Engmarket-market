<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Eng Market Test</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f9; margin: 0; padding-bottom: 80px; }
        header { background: #0d1b2a; color: #c5a059; padding: 20px; text-align: center; border-bottom: 3px solid #c5a059; }
        .btn-lang { background: #c5a059; border: none; padding: 10px; cursor: pointer; font-weight: bold; }
        .card { background: white; margin: 20px; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .footer { position: fixed; bottom: 0; width: 100%; background: black; color: white; display: flex; justify-content: space-around; padding: 15px 0; border-top: 2px solid #c5a059; }
    </style>
</head>
<body>

<header>
    <h1>ENG MARKET</h1>
    <button class="btn-lang" onclick="alert('الترجمة تعمل!')">English</button>
</header>

<div class="card">
    <h3>📊 حالة السوق</h3>
    <p>طن الحديد: $610</p>
</div>

<div class="footer">
    <span>🏠 الرئيسية</span>
    <span>👤 حسابي</span>
    <span>📝 طلباتي</span>
</div>

</body>
</html>
