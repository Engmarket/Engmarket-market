<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eng Market | Metalco Steel</title>
    <style>
        :root { --primary: #2c3e50; --accent: #f39c12; --light: #f4f7f6; --success: #27ae60; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: var(--light); color: #333; transition: 0.3s; }
        .ticker-wrap { width: 100%; overflow: hidden; background: #1a1a1a; color: #fff; padding: 12px 0; position: sticky; top: 0; z-index: 1000; border-bottom: 2px solid var(--accent); }
        .ticker { display: flex; white-space: nowrap; animation: ticker 40s linear infinite; }
        .ticker-item { padding: 0 25px; font-weight: bold; font-size: 0.9rem; border-left: 1px dashed #444; }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .lang-btn { position: absolute; left: 15px; top: 10px; background: var(--accent); color: white; border: none; padding: 6px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; z-index: 1100; }
        header { background: var(--primary); color: white; padding: 40px 20px; text-align: center; position: relative; }
        #mainSearch { width: 90%; max-width: 600px; padding: 12px 20px; border-radius: 25px; border: none; margin-top: 20px; outline: none; }
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .section-title { text-align: center; color: var(--primary); margin-bottom: 25px; font-size: 1.8rem; border-bottom: 3px solid var(--accent); display: table; margin: 0 auto 25px; padding-bottom: 10px; }
        .ad-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; margin-bottom: 40px; }
        .ad-card { background: #fff8e1; border: 2px solid var(--accent); padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .wa-link { background: var(--success); color: white; padding: 8px 15px; border-radius: 8px; text-decoration: none; font-weight: bold; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 50px; }
        .category-card { background: white; padding: 20px 10px; border-radius: 10px; text-align: center; cursor: pointer; border: 1px solid #eee; font-weight: bold; color: var(--primary); transition: 0.3s; }
        .category-card:hover { transform: translateY(-3px); border-color: var(--accent); }
        .footer { text-align: center; padding: 40px; background: #222; color: #fff; margin-top: 50px; }
        .visitor-counter { margin-top: 15px; padding: 10px; background: #333; display: inline-block; border-radius: 10px; border: 1px solid #444; }
    </style>
</head>
<body>

    <button class="lang-btn" onclick="toggleLang()" id="langBtn">English</button>

    <div class="ticker-wrap">
        <div class="ticker">
            <span class="ticker-item">🟡 Gold (21k): $72.40</span>
            <span class="ticker-item">💵 USD/LBP: 89,500 L.L</span>
            <span class="ticker-item">🏗️ Steel (Rebar): $715/Ton</span>
            <span class="ticker-item">🧱 Cement: $145/Ton</span>
        </div>
    </div>

    <header>
        <h1>METALCO STEEL SARL</h1>
        <p id="subTitle">Eng Market - المنصة الهندسية والإنشائية الأولى في لبنان</p>
        <input type="text" id="mainSearch" onkeyup="filterCats()" placeholder="ابحث عن اختصاص...">
    </header>

    <div class="container">
        <h2 class="section-title" id="adTitle">الشركات المعتمدة والمميزة</h2>
        <div class="ad-container" id="adBox"></div>

        <h2 class="section-title" id="secTitle">كافة التخصصات الهندسية</h2>
        <div id="grid" class="grid-container"></div>
    </div>

    <footer class="footer">
        <p>© 2026 Metalco Steel | Admin: 70822806</p>
        <div class="visitor-counter">
            <p style="font-size: 0.7rem; color: #aaa; margin-bottom: 5px;">عدد الزوار / Visitors</p>
            <img src="https://www.cutercounter.com/hits.php?id=gvxpoxn&nd=6&style=1" border="0" alt="visitor counter">
        </div>
    </footer>

    <script>
        const companies = [
            { nameAr: "شركة ميتالكو ستيل", nameEn: "Metalco Steel Co.", catAr: "حديد البناء", catEn: "Construction Steel", phone: "03761784", descAr: "صناعة وتجارة كافة أنواع الحديد", descEn: "Steel Industry & Trading" },
            { nameAr: "شركة صقر للأخشاب", nameEn: "Sakr Wood", catAr: "أخشاب وقشرة", catEn: "Wood & Veneer", phone: "03000000", descAr: "تجارة الأخشاب والمواد الأولية", descEn: "Wood & Raw Materials Trading" },
            { nameAr: "شركة الميدان للألمنيوم", nameEn: "Al Midan Aluminum", catAr: "ألمنيوم و PVC", catEn: "Aluminum & PVC", phone: "03000000", descAr: "تجارة الألمنيوم والإكسسوارات", descEn: "Aluminum & Accessories" }
        ];

        const catsAr = ["حديد البناء", "باطون جاهز", "رخام وغرانيت", "قص ليزر", "قص راوتر", "أخشاب وقشرة", "ألمنيوم و PVC", "أحجار ورمل", "طاقة شمسية", "تكييف وتدفئة", "مصاعد", "دهانات وعزل", "مطابخ", "مفروشات", "مكاتب هندسية", "مقاولات", "ألواح كوبوند", "بلاستيك وأكريليك", "آرمات إعلانية", "خرضوات وعدة", "زجاج ومرايا", "معدات ثقيلة", "ترابة وسمنت"];
        const catsEn = ["Construction Steel", "Ready Mix Concrete", "Marble & Granite", "Laser Cutting", "Router Cutting", "Wood & Veneer", "Aluminum & PVC", "Stone & Sand", "Solar Energy", "HVAC", "Elevators", "Paint & Insulation", "Kitchens", "Furniture", "Engineering Offices", "Contracting", "Alucobond/ACP", "Plastic & Acrylic", "Signage", "Hardware & Tools", "Glass & Mirrors", "Heavy Equipment", "Cement"];

        let lang = 'ar';

        function render() {
            const grid = document.getElementById('grid');
            const adBox = document.getElementById('adBox');
            grid.innerHTML = ''; adBox.innerHTML = '';
            
            const list = lang === 'ar' ? catsAr : catsEn;
            list.forEach(c => {
                let div = document.createElement('div');
                div.className = 'category-card';
                div.innerText = c;
                grid.appendChild(div);
            });

            companies.forEach(comp => {
                let card = document.createElement('div');
                card.className = 'ad-card';
                card.innerHTML = `<div><h4>${lang === 'ar' ? comp.nameAr : comp.nameEn}</h4><p>${lang === 'ar' ? comp.descAr : comp.descEn}</p></div><a href="https://wa.me/961${comp.phone.substring(1)}" class="wa-link">${lang === 'ar' ? 'واتساب' : 'WhatsApp'}</a>`;
                adBox.appendChild(card);
            });
        }

        function toggleLang() {
            lang = lang === 'ar' ? 'en' : 'ar';
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('langBtn').innerText = lang === 'ar' ? 'English' : 'العربية';
            document.getElementById('subTitle').innerText = lang === 'ar' ? "Eng Market - المنصة الهندسية والإنشائية الأولى في لبنان" : "Eng Market - Lebanon's Premier Engineering Platform";
            document.getElementById('adTitle').innerText = lang === 'ar' ? "الشركات المعتمدة والمميزة" : "Featured & Verified Companies";
            document.getElementById('secTitle').innerText = lang === 'ar' ? "كافة التخصصات الهندسية" : "All Engineering Specialties";
            render();
        }

        function filterCats() {
            let val = document.getElementById('mainSearch').value.toLowerCase();
            document.querySelectorAll('.category-card').forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(val) ? "block" : "none";
            });
        }

        window.onload = render;
    </script>
</body>
</html>
