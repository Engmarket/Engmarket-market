<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Eng Market | Master</title>
    <style>
        :root { --p: #0d1b2a; --b: #c5a059; --w: #fff; }
        body { font-family: sans-serif; margin: 0; background: #f4f7f9; }
        header { background: var(--p); padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--b); color: var(--b); }
        .lang-btn { border: 1px solid var(--b); color: var(--b); background: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .hero { width: 100%; height: 200px; background: #000; position: relative; overflow: hidden; }
        .slide { position: absolute; width: 100%; height: 100%; opacity: 0; transition: 1s; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; color: var(--b); font-weight: bold; font-size: 1.2rem; text-align: center; }
        .slide.active { opacity: 0.6; }
        .search-box { padding: 20px; background: var(--w); }
        #sInput { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .ribbon { display: flex; overflow-x: auto; gap: 15px; padding: 15px; background: var(--w); }
        .icon-item { text-align: center; min-width: 60px; }
        .circle { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--b); display: flex; align-items: center; justify-content: center; margin: 0 auto 5px; font-size: 1.5rem; background: var(--w); }
        .grid { display: grid; grid-template-columns: 1fr; gap: 15px; padding: 15px; }
        .card { background: var(--w); padding: 15px; border-radius: 10px; border: 1px solid #eee; position: relative; }
        .v { position: absolute; top: 10px; left: 10px; color: green; font-size: 0.7rem; font-weight: bold; }
        .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .btn { padding: 10px; text-align: center; border-radius: 5px; text-decoration: none; font-weight: bold; color: var(--w); font-size: 0.8rem; }
    </style>
</head>
<body>

<header>
    <div style="font-weight:900;">ENG MARKET</div>
    <button class="lang-btn" onclick="tg()" id="lb">English</button>
</header>

<div class="hero">
    <div class="slide active" style="background-image:url('https://images.unsplash.com/photo-1541888946425-d81bb19480c5?w=400')"><h2>دليلك الهندسي</h2></div>
    <div class="slide" style="background-image:url('https://images.unsplash.com/photo-1503387762-592dee58c460?w=400')"><h2>أفضل الموردين</h2></div>
</div>

<div class="search-box">
    <input type="text" id="sInput" onkeyup="srch()" placeholder="ابحث هنا...">
</div>

<div class="ribbon" id="rb"></div>
<div class="grid" id="gr"></div>

<script>
    let L = 'ar';
    const ui = {
        ar: { s: "ابحث هنا...", c: "اتصال", w: "واتساب", b: "English" },
        en: { s: "Search here...", c: "Call", w: "WhatsApp", b: "العربية" }
    };
    const cats = [
        {n:"حديد", e:"Steel", i:"🏗️"}, {n:"باطون", e:"Concrete", i:"🚚"}, {n:"طاقة", e:"Solar", i:"☀️"}, {n:"كهرباء", e:"Electric", i:"💡"}
    ];
    const comps = [
        {n: "ميتالكو ستيل", c: "حديد", p: "96103761784", d: "توريد حديد البناء", v: true},
        {n: "صقر الشمال", c: "خشب", p: "96103000000", d: "تجارة الأخشاب", v: true}
    ];

    function tg() {
        L = L === 'ar' ? 'en' : 'ar';
        document.documentElement.dir = L === 'ar' ? 'rtl' : 'ltr';
        document.getElementById('lb').innerText = ui[L].b;
        document.getElementById('sInput').placeholder = ui[L].s;
        init();
    }

    function init() {
        const r = document.getElementById('rb'); r.innerHTML = '';
        cats.forEach(c => {
            r.innerHTML += `<div class="icon-item" onclick="flt('${c.n}')"><div class="circle">${c.i}</div><span style="font-size:0.6rem;font-weight:bold">${L==='ar'?c.n:c.e}</span></div>`;
        });
        rndr(comps);
    }

    function rndr(d) {
        const g = document.getElementById('gr'); g.innerHTML = '';
        d.forEach(c => {
            g.innerHTML += `<div class="card">${c.v?'<span class="v">✓ موثق</span>':''}<div style="color:var(--b);font-size:0.7rem">📍 ${c.c}</div><h3 style="margin:5px 0">${c.n}</h3><p style="font-size:0.7rem;color:#666">${c.d}</p><div class="btns"><a href="tel:${c.p}" class="btn" style="background:var(--p)">${ui[L].c}</a><a href="https://wa.me/${c.p}" class="btn" style="background:#25d366">${ui[L].w}</a></div></div>`;
        });
    }

    function srch() {
        const v = document.getElementById('sInput').value.toLowerCase();
        rndr(comps.filter(c => c.n.toLowerCase().includes(v)));
    }
    
    function flt(cat) { rndr(comps.filter(c => c.c === cat)); }

    setInterval(() => {
        let s = document.querySelectorAll('.slide'), a = document.querySelector('.slide.active');
        a.classList.remove('active');
        (a.nextElementSibling || s[0]).classList.add('active');
    }, 3000);

    window.onload = init;
</script>
</body>
</html>
